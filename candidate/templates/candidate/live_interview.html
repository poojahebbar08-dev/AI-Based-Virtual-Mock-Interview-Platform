{% extends 'base.html' %}
{% load static %}

{% block content %}
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        .interview-container {
            display: flex;
            height: 90vh;
            padding: 10px;
            gap: 10px;
        }
        .jitsi-frame {
            flex: 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>

<div class="interview-container">
    <!-- Jitsi Frame -->
    <div class="jitsi-frame">
        <iframe src="{{ booking.meeting_url }}" width="100%" height="100%" allow="camera; microphone; fullscreen; display-capture" style="border: none;"></iframe>
    </div>
</div>
{% endblock %}
