<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Booked Time Slots</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
	<style>
		body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #ffffff; color: #222222; }
		.navbar { background: #ffffff; color:#fff; padding:1rem 2rem; display:flex; justify-content:space-between; }
		.navbar a { color:#fff; text-decoration:none; margin-left:1rem; }
		.container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
		.slot-card { background:#fff; border-radius: 8px; padding:1rem; margin-bottom:1rem; box-shadow: rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px, rgba(0,0,0,0.1) 0 4px 8px; display:flex; justify-content:space-between; align-items:center; }
		.slot-date { font-weight:600; }
		.slot-time { color:#666; font-size:0.95rem; }
		.badge { padding:6px 12px; border-radius:16px; background:#28a745; color:#fff; font-size:0.8rem; }
	</style>

    <!-- AIRBNB THEME OVERRIDES -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --rausch: #ff385c;
            --rausch-active: #e00b41;
            --ink: #222222;
            --canvas: #ffffff;
            --surface-soft: #f7f7f7;
            --hairline: #dddddd;
            --muted: #6a6a6a;
            --shadow: rgba(0,0,0,0.02) 0 0 0 1px, rgba(0,0,0,0.04) 0 2px 6px, rgba(0,0,0,0.1) 0 4px 8px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
            background: var(--canvas) !important;
            color: var(--ink) !important;
        }

        .container, .form-container, .card, .dashboard-card {
            background: var(--canvas) !important;
            border-radius: 14px !important;
            border: 1px solid var(--hairline) !important;
            box-shadow: var(--shadow) !important;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--ink) !important;
            font-weight: 600 !important;
        }

        button, .btn, .btn-primary, input[type="submit"] {
            background: var(--rausch) !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            border: none !important;
            padding: 14px 24px !important;
            font-weight: 500 !important;
            box-shadow: none !important;
            transition: all 0.2s ease !important;
            text-transform: none !important;
            font-size: 16px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
        }

        button:hover, .btn:hover, .btn-primary:hover, input[type="submit"]:hover {
            background: var(--rausch-active) !important;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-secondary, .btn-outline, .btn-cancel {
            background: var(--canvas) !important;
            color: var(--ink) !important;
            border: 1px solid var(--ink) !important;
        }

        .btn-secondary:hover, .btn-outline:hover, .btn-cancel:hover {
            background: var(--surface-soft) !important;
        }

        input[type="text"], input[type="email"], input[type="password"], input[type="number"], input[type="date"], input[type="time"], textarea, select, .form-control {
            background: var(--canvas) !important;
            border: 1px solid var(--hairline) !important;
            border-radius: 8px !important;
            color: var(--ink) !important;
            padding: 14px 12px !important;
            box-shadow: none !important;
            width: 100% !important;
        }

        input:focus, textarea:focus, select:focus, .form-control:focus {
            border: 2px solid var(--ink) !important;
            outline: none !important;
            padding: 13px 11px !important;
        }

        a {
            color: var(--ink) !important;
            font-weight: 500 !important;
            text-decoration: underline !important;
        }

        a:hover {
            color: var(--muted) !important;
        }

        .header, nav, .navbar, .top-nav, .sidebar {
            background: var(--canvas) !important;
            border-bottom: 1px solid var(--hairline) !important;
            box-shadow: none !important;
            color: var(--ink) !important;
        }

        .header *, nav *, .navbar *, .sidebar * {
            color: var(--ink) !important;
        }

        i.fa, i.fas, i.far, i.fab {
            color: var(--ink) !important;
        }

        .btn i, button i, .btn-primary i {
            color: #ffffff !important;
        }

        .home-btn {
            background: var(--surface-soft) !important;
            color: var(--ink) !important;
            border: 1px solid var(--hairline) !important;
            text-decoration: none !important;
        }
        .home-btn:hover {
            background: var(--hairline) !important;
        }

        .alert-success {
            background: #e8f9e8 !important;
            color: #1a5e1a !important;
            border: 1px solid #1a5e1a !important;
        }
        
        .alert-error, .alert-danger {
            background: #fdf2f2 !important;
            color: var(--rausch) !important;
            border: 1px solid var(--rausch) !important;
        }

        /* Remove background gradients */
        body { background-image: none !important; }
        .header { background-image: none !important; }
        .btn { background-image: none !important; }
        .logo { background-clip: initial !important; -webkit-text-fill-color: initial !important; color: var(--rausch) !important; }
        .logo-icon { background: var(--rausch) !important; color: white !important; }
        
        /* Specific adjustments for search/pills */
        .search-bar, .pill {
            border-radius: 9999px !important;
        }

        /* Listing card adjustments */
        .property-card {
            border-radius: 14px !important;
            overflow: hidden !important;
            border: none !important;
        }

        /* Fix label colors */
        label {
            color: var(--ink) !important;
            font-weight: 500 !important;
        }
    </style>
    <!-- END AIRBNB THEME -->
</head>
<body>
	<nav class="navbar">
		<div>Booked Time Slots</div>
		<div>
			<a href="{% url 'hr_dashboard' %}"><i class="fas fa-home"></i> Dashboard</a>
		</div>
	</nav>
	<div class="container">
		{% if booked_slots %}
			{% for slot in booked_slots %}
				<div class="slot-card">
					<div>
						<div class="slot-date">{{ slot.date|date:"l, F j, Y" }}</div>
						<div class="slot-time">{{ slot.safe_time_display }}</div>
					</div>
					<div class="badge"><i class="fas fa-lock"></i> Booked</div>
				</div>
			{% endfor %}
		{% else %}
			<p>No booked slots.</p>
		{% endif %}
	</div>
</body>
</html>
